name: forensight

x-backend-common: &backend-common
  build:
    context: ./backend
    args:
      INSTALL_ML: ${INSTALL_ML:-false}
  env_file: .env
  volumes:
    - ./backend:/app
    - ./storage:/storage
    - ./models:/models:ro
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  backend:
    <<: *backend-common
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"

  worker:
    <<: *backend-common
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=2

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Opt-in: docker compose --profile ml up ml
  ml:
    profiles: ["ml"]
    build: ./ml
    volumes:
      - ./ml:/workspace/ml
      - ./data:/workspace/data
      - ./models:/workspace/models
    ports:
      - "8888:8888"

volumes:
  mysql-data:
